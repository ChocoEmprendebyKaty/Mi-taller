<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MI TALLER FUNCIONA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #2C1203;
      font-family: 'Georgia', serif;
      overflow: hidden;
      text-align: center;
      padding: 2rem;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .titulo {
      font-size: clamp(2.5rem, 10vw, 7rem);
      font-weight: 900;
      color: #C9A22B;
      line-height: 1.1;
      text-shadow: 0 4px 30px rgba(201,162,43,0.4);
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .titulo span { color: #ffffff; }

    .btn {
      background: #C9A22B;
      color: #2C1203;
      border: none;
      font-size: 1.3rem;
      font-weight: 800;
      padding: 1rem 2.5rem;
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 24px rgba(201,162,43,0.4);
    }
    .btn:hover  { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(201,162,43,0.5); }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <canvas id="confeti"></canvas>

  <p class="titulo"><span>MI TALLER</span><br>FUNCIONA</p>
  <button class="btn" onclick="lanzarConfeti()">🎉 ¡CELEBREMOS!</button>

  <script>
    const canvas = document.getElementById('confeti');
    const ctx = canvas.getContext('2d');
    let piezas = [];
    let animando = false;

    const colores = ['#C9A22B','#E8C84A','#ffffff','#8B4513','#F2E4CC','#ff6b9d','#5C2D0A'];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function crearPieza() {
      return {
        x: Math.random() * canvas.width,
        y: -20,
        w: 8 + Math.random() * 10,
        h: 5 + Math.random() * 8,
        color: colores[Math.floor(Math.random() * colores.length)],
        rot: Math.random() * Math.PI * 2,
        velX: (Math.random() - 0.5) * 4,
        velY: 3 + Math.random() * 5,
        velRot: (Math.random() - 0.5) * 0.2,
        opacidad: 1,
        forma: Math.random() > 0.5 ? 'rect' : 'circulo'
      };
    }

    function lanzarConfeti() {
      for (let i = 0; i < 180; i++) {
        const p = crearPieza();
        p.y = -20 - Math.random() * 200;
        piezas.push(p);
      }
      if (!animando) animar();
    }

    function animar() {
      animando = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      piezas.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.opacidad;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.forma === 'rect') {
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        p.x   += p.velX;
        p.y   += p.velY;
        p.rot += p.velRot;
        p.velY += 0.08;

        if (p.y > canvas.height * 0.75) p.opacidad -= 0.025;
      });

      piezas = piezas.filter(p => p.opacidad > 0);

      if (piezas.length > 0) {
        requestAnimationFrame(animar);
      } else {
        animando = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  </script>

</body>
</html>
